# The product editor's "Upload to website" button (edit.html) puts the changes in edits/inbox/ on this branch.
# This applies them with tools/publish-upload.js (tidy and check, apply, rebuild the product pages and small photos),
# writes the result to edits/status/ for the editor to show, and publishes the site to gh-pages.
name: Publish product editor upload
on:
  push:
    branches: [claude/website-changes-9vx8yk]
    paths: ['edits/inbox/**']
  workflow_dispatch:
concurrency:
  group: publish-editor-upload
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/website-changes-9vx8yk
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - name: Apply the upload, check it and publish the website
        run: node tools/publish-upload.js
