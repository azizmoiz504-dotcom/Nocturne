<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#040c13">
<title>Fakhri Tools Catalogue</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="is-booting">

<!-- opening animation: picks up exactly where the phone's own launch screen leaves off -->
<div id="splash" aria-hidden="true">
  <div class="sp__glow"></div>
  <div class="sp__mark"><img src="img/icon-512.png" alt=""></div>
  <div class="sp__word">
    <div class="sp__line"><span>FAKHRI TOOLS</span></div>
    <div class="sp__sub"><span>&amp; Workshop Materials Trading LLC</span></div>
  </div>
  <div class="sp__bar"><i></i></div>
</div>

<main id="stage" aria-live="polite"></main>

<nav id="tabs" aria-label="Main">
  <button data-tab="home" class="is-on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-tab="orders"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg><span>Orders</span></button>
  <button data-tab="cart"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H7"/><circle cx="9.5" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span>Cart</span><b id="badge" hidden>0</b></button>
  <i id="tabInk"></i>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true"><div class="sheet__grip"></div><div id="sheetBody"></div></div>
</div>

<div id="zoom" hidden><div class="zoom__img"><img alt=""></div><button class="zoom__x" data-close aria-label="Close">✕</button><p class="zoom__hint">Pinch or double-tap to zoom</p></div>

<div id="present" hidden></div>

<div id="toast" role="status"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
