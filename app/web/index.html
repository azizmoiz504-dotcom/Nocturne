<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0a0b">
<title>Sales Catalogue</title>
<link rel="stylesheet" href="app.css">
<script>/* the branch's colours before anything is drawn */try{var b=(window.FT_WEB&&FT_WEB.brand)||(window.FTNative&&FTNative.brand&&FTNative.brand())||JSON.parse(localStorage.getItem('app-brand')||'""');document.documentElement.setAttribute('data-brand',b==='bam'?'bam':b==='fakhri'?'fakhri':'none');if(JSON.parse(localStorage.getItem('app-lang')||'""')==='ar'){document.documentElement.dir='rtl';document.documentElement.lang='ar'}}catch(e){}</script>
</head>
<body class="is-booting">

<!-- opening: the branch's logo on its own colour -->
<div id="splash" aria-hidden="true"><img class="sp__logo" alt=""><div class="sp__bar"><i></i></div></div>

<main id="stage" aria-live="polite"></main>

<nav id="tabs" aria-label="Main"></nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true"><div class="sheet__grip"></div><div id="sheetBody"></div></div>
</div>

<div id="zoom" hidden><div class="zoom__img"><img alt=""></div><img class="wm" src="img/logo-stacked.png" alt="" aria-hidden="true"><button class="zoom__x" data-close aria-label="Close">✕</button><p class="zoom__hint"></p></div>

<div id="toast" role="status"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="choices.js"></script>
<script src="bam/data.js"></script>
<script src="bam/ar.js"></script>
<script src="bam/clients.js"></script>
<script src="orderform.js"></script>
<script src="app.js"></script>
</body>
</html>
