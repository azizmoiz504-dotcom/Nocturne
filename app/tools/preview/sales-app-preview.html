<title>Sales App Preview</title>
<meta name="theme-color" content="#f3f4f6">
<link rel="stylesheet" href="app.css">
<style>
:root{--pv-backdrop:#e9e7e2;--pv-caption:#55524c;--pv-note-bg:#111214;--pv-note-text:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pv-backdrop:#1b1d22;--pv-caption:#a9adb6}}
:root[data-theme="dark"]{--pv-backdrop:#1b1d22;--pv-caption:#a9adb6}
/* on a computer the app sits in a phone-sized frame */
@media (min-width:560px){
  html{background:var(--pv-backdrop)!important}
  body{width:412px;height:min(880px,calc(100% - 64px));margin:16px auto 0;transform:translateZ(0);border-radius:28px;overflow:hidden;box-shadow:0 0 0 10px #0d0d0f,0 24px 60px rgba(0,0,0,.35)}
  html::after{content:"Browser preview. On the phone, order forms, PDFs and WhatsApp open in their own apps.";position:fixed;left:0;right:0;bottom:14px;text-align:center;font:13px/1.4 system-ui,sans-serif;color:var(--pv-caption);padding:0 16px}
}
#pv-note{position:fixed;left:16px;right:16px;top:16px;z-index:9999;background:var(--pv-note-bg);color:var(--pv-note-text);font:14px/1.4 system-ui,sans-serif;padding:12px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(-8px);transition:.2s;pointer-events:none}
#pv-note.is-on{opacity:1;transform:none}
#pv-pdf{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9998;background:#3a3c42;display:flex;flex-direction:column;font-family:system-ui,sans-serif}
.pv-pdf__bar{display:flex;align-items:center;padding:12px 12px 12px 16px;background:#111214;color:#fff}
.pv-pdf__bar b{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.pv-pdf__bar button{background:#fff;color:#111;border:0;border-radius:999px;font:600 14px system-ui,sans-serif;padding:9px 16px;cursor:pointer}
.pv-pdf__note{margin:0;padding:8px 16px;background:#24262b;color:#c9ccd2;font-size:12.5px}
.pv-pdf__pages{flex:1;overflow-x:hidden;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
.pv-pdf__pages canvas{display:block;width:100%;height:auto;margin:0 0 8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pv-pdf__wait{color:#fff;text-align:center;margin-top:40px;font-size:14px}
</style>
<script>if(document.body)document.body.classList.add('is-booting')</script>
<script src="packs.js"></script>
<script src="preview.js"></script>
<script>/* the branch's colours before anything is drawn */try{var b=(window.FT_WEB&&FT_WEB.brand)||JSON.parse(localStorage.getItem('app-brand')||'""');document.documentElement.setAttribute('data-brand',/^(fakhri|bam|mabrook|me)$/.test(b)?b:'none');document.documentElement.setAttribute('data-theme',JSON.parse(localStorage.getItem('app-theme')||'""')==='dark'?'dark':'light');if(JSON.parse(localStorage.getItem('app-lang')||'""')==='ar'){document.documentElement.dir='rtl';document.documentElement.lang='ar'}}catch(e){}</script>

<!-- opening: the branch's logo on its own colour -->
<div id="splash" aria-hidden="true"><img class="sp__logo" alt=""><div class="sp__bar"><i></i></div></div>

<main id="stage" aria-live="polite"></main>

<nav id="tabs" aria-label="Main"></nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true"><div class="sheet__grip"></div><div id="sheetBody"></div></div>
</div>

<div id="zoom" hidden><div class="zoom__img"><img alt=""></div><img class="wm" src="img/logo-stacked.png" alt="" aria-hidden="true"><button class="zoom__x" data-close aria-label="Close">✕</button><p class="zoom__hint"></p></div>

<div id="toast" role="status"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="choices.js"></script>
<script src="bam/data.js"></script>
<script src="bam/ar.js"></script>
<script src="bam/clients.js"></script>
<script src="me/data.js"></script>
<script src="me/ar.js"></script>
<script src="orderform.js"></script>
<script src="app.js"></script>
